sonar.projectKey=DevCraftersEnterprise_botbite-waiter-api
sonar.organization=devcraftersenterprise

sonar.sources=src
sonar.tests=src,test
sonar.test.inclusions=**/*.spec.ts,test/**
sonar.exclusions=**/*.spec.ts,**/node_modules/**,**/dist/**

# La cobertura junta las pruebas unitarias y las e2e: las e2e corren la API
# completa contra Postgres y cubren la mayor parte de los servicios.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,coverage-e2e/lcov.info

# Las migraciones se prueban corriéndolas contra una base real (subir, bajar y
# volver a subir), no con pruebas unitarias.
sonar.coverage.exclusions=src/database/migrations/**

# Las migraciones repiten, por diseño, el SQL de las tablas que crean o borran.
sonar.cpd.exclusions=src/database/migrations/**
