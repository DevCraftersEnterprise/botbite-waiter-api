name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # "test" es el check obligatorio de las reglas que protegen dev y main.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: botbite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: E2E tests
        # Corre todas las migraciones sobre la base vacía del servicio postgres.
        env:
          E2E_DB_HOST: localhost
          E2E_DB_PORT: 5432
          E2E_DB_USERNAME: postgres
          E2E_DB_PASSWORD: postgres
          E2E_DB_NAME: botbite_test
        run: npm run test:e2e
